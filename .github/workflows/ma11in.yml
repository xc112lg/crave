name: EvoX Scripts

on:
  #push:
   # branches:
    #  - main 
  workflow_dispatch:
    inputs:
      BASE_PROJECT:
        description: 'Choose a base project:'
        required: true
        default: 'LineageOS21'
        type: choice
        options:
          - 'ArrowOS13'
          - 'DerpFest13'
          - 'LineageOS20'
          - 'LineageOS21'
          - 'CipherOS'
      
      THE_FORBIDDEN_ONE :
        description: 'Use this command at caution it might delete you project, nahh who cares'
        required: false
        default: 'rm -rf scripts;git clone https://github.com/xc112lg/scripts.git -b patch-4;chmod u+x scripts/sync.sh;bash scripts/sync.sh'
      CLEAN_BUILD:
        description: 'Build with a clean workspace? Selecting Yes here will reset the data to its default state removing any of your work'
        required: true
        default: 'no'
        type: choice
        options: 
        - 'yes'
        - 'no'
      # SAY_SOMETHING_NICE :
      #   description: 'anything you want to say'
      #   required: false
      #   default: ''
              
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git clean -fdX


      - name: Set up Environment
        run: |
          BASE_PROJECT_NAME="${{ inputs.BASE_PROJECT }}"
          case $BASE_PROJECT_NAME in
            'ArrowOS13') BASE_PROJECT_VALUE='repo init -u https://github.com/ArrowOS/android_manifest.git -b arrow-13.1 --depth=1' ;;
            'DerpFest13') BASE_PROJECT_VALUE='repo init -u https://github.com/DerpFest-AOSP/manifest.git -b 13 --depth=1' ;;
            'LineageOS20') BASE_PROJECT_VALUE='repo init -u https://github.com/accupara/los20.git -b lineage-20.0 --git-lfs --depth=1' ;;
            'LineageOS21') BASE_PROJECT_VALUE='repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --git-lfs --depth=1' ;;
            'CipherOS') BASE_PROJECT_VALUE='repo init -u https://github.com/CipherOS/android_manifest.git -b fourteen --git-lfs --depth=1' ;;
            *) BASE_PROJECT_VALUE='default-command' ;;  # Provide a default command for unknown options
          esac
          echo "BASE_PROJECT_NAME=$BASE_PROJECT_NAME" >> $GITHUB_ENV
          echo "BASE_PROJECT_VALUE=$BASE_PROJECT_VALUE" >> $GITHUB_ENV

      - name: Edit run.sh
        run: |
          if [ "${{ inputs.CLEAN_BUILD }}" == "yes" ]; then
            export CLEAN_FLAG="--clean"
          else
            export CLEAN_FLAG=""
          fi

          if [ -n "${{ inputs.BUILD_DIFFERENT_ROM }}" ]; then
            export deleteprep="prebuilts/clang/host/linux-x86 prebuilts/rust"
          else
            export deleteprep=""
          fi

          echo "THE_FORBIDDEN_ONE: ${{ inputs.THE_FORBIDDEN_ONE }}"
          echo "PRODUCT_NAME: ${{ inputs.PRODUCT_NAME }}"

          # Bail out immediately if both are set — no point generating anything
          if [ -n "${{ inputs.THE_FORBIDDEN_ONE }}" ] && [ -n "${{ inputs.PRODUCT_NAME }}" ]; then
              echo "Both THE_FORBIDDEN_ONE and PRODUCT_NAME have values. Cannot run this command. Exiting."
              exit 1
          fi

          # --- run.sh ---
          printf '%s\n' \
            '#!/bin/bash' \
            'export GH_TOKEN=$(cat gh_token.txt)' \
            'gh auth login --with-token $GH_TOKEN' \
            'gh auth status' \
            'mkdir -p ${{ inputs.BASE_PROJECT }}' \
            'bp=$(cat bp.txt)' \
            'cp -f crave/run1.sh run1.sh' \
            'chmod +x run1.sh' \
            'cp -f crave/craverun.sh ${{ inputs.BASE_PROJECT }}' \
            'tmux set-environment bp "$bp"' \
            'tmux kill-session -t $bp' \
            'tmux new-session -d -s $bp' \
            'tmux list-session -t $bp' \
            "tmux send-keys -t \$bp 'C-a' 'C-k' './run1.sh' 'C-m'" \
            'echo "$(pwd)" > bp.txt' \
            > run.sh

          # --- run1.sh ---
          printf '%s\n' \
            "export GH_TOKEN=\$(cat gh_token.txt)" \
            "gh auth login --with-token \$GH_TOKEN" \
            "cd ${{ inputs.BASE_PROJECT }}" \
            "$BASE_PROJECT_VALUE" \
            "chmod +x craverun.sh" \
            ". craverun.sh" \
            > run1.sh

          # --- craverun.sh header (always the same) ---
          printf '%s\n' \
            '#!/bin/bash' \
            'rm -rf Evolution-X' \
            "git clone https://\$GH_TOKEN@github.com/xc112lg/Evolution-X.git" \
            'cp -f Evolution-X/a.sh a.sh' \
            'chmod +x a.sh' \
            'basename "$(pwd)" > bp.txt' \
            'crave run --no-patch $CLEAN_FLAG -- "          #© crave.io Inc. 2017-2024' \
            '              #Thanks to UV n Team' \
            '        #no dual account just to build faster' \
            '              #respect the rule' \
            > craverun.sh

          # --- craverun.sh body: branch decided once, up front ---
          if [ -n "${{ inputs.THE_FORBIDDEN_ONE }}" ]; then
              printf '%s\n' \
                "${{ inputs.BUILD_DIFFERENT_ROM }}" \
                "${{ inputs.THE_FORBIDDEN_ONE }}" \
                >> craverun.sh
          else
              printf '%s\n' \
                "${{ inputs.BUILD_DIFFERENT_ROM }}" \
                "rm -rf .repo/local_manifests \$deleteprep ${{ inputs.REMOVALS }}" \
                "git clone ${{ inputs.LOCAL_MANIFEST }} -b ${{ inputs.LOCAL_MANIFEST_BRANCH }} .repo/local_manifests" \
                'repo sync -c -j\$(nproc --all) --force-sync --no-clone-bundle --no-tags' \
                "source build/envsetup.sh" \
                "m installclean" \
                "lunch ${{ inputs.PRODUCT_NAME }}${{ inputs.BUILD_TYPE }}" \
                "${{ inputs.BUILD_COMMAND }}" \
                >> craverun.sh
          fi

          printf '%s\n' \
            '"' \
            '. a.sh' \
            >> craverun.sh

      - name: Check for changes
        id: check_changes
        run: |
          changes=$(git diff --name-only)
          if [ -z "$changes" ]; then
            echo "CHANGES=false" >> $GITHUB_ENV
          else
            echo "CHANGES=true" >> $GITHUB_ENV
          fi

      - name: Commit changes
        if: env.CHANGES == 'true'
        run: |
          git add .
          git commit -m "Update run.sh with commands"
          git status

      - name: Push changes
        if: env.CHANGES == 'true'
        run: |
          git push https://github.com/${{ github.repository }}.git HEAD:main
        env:
          GH_TOKEN: ${{ secrets.PAT }}      

      - name: Set File URL
        id: set_url
        run: echo "::set-output name=url::${{ secrets.GH_TOKEN }}@raw.githubusercontent.com/${{ github.repository }}/main/run.sh"

      #- name: Download File
      #  run: wget -O run.sh "${{ steps.set_url.outputs.url }}"


      - name: Download and Run get_crave.sh
        run: |
          curl -s https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash -s --
          echo '${{ secrets.CONF }}' > crave.conf



      - name: Run Crave
        timeout-minutes: 5
        run: |
          echo "tmux detach-client -s ${{ inputs.BASE_PROJECT }}; tmux new-session -s ${{ inputs.BASE_PROJECT }} \; send-keys -t ${{ inputs.BASE_PROJECT }}:0 \"./run.sh\" C-m"
          
          # Run your commands and continue even if there is an error
          ./crave -c ./crave.conf devspace || true
          ./crave devspace 'echo "${{ secrets.GH_TOKEN }}" > gh_token.txt;export GH_TOKEN=$(cat gh_token.txt);echo "${{ inputs.BASE_PROJECT }}" > bp.txt;bp=$($bp);rm -rf crave;git clone https://$GH_TOKEN@github.com/${{ github.repository }}.git;rm run.sh;cp -f crave/run.sh run.sh;chmod +x run.sh;. run.sh' || true

      - name: Display Build URL
        run: |
            echo "Build Sent Check on Foss to verify after a minute"
            echo "Build URL: [https://foss.crave.io/app/#/build?team=14](https://foss.crave.io/app/#/build?team=14)"
